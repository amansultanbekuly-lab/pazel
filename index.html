function upl(i,inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=800;c.height=600;const x=c.getContext('2d'),s=Math.max(800/im.width,600/im.height),w=im.width*s,h=im.height*s;x.drawImage(im,(800-w)/2,(600-h)/2,w,h);IM[i]=c.toDataURL('image/jpeg',.85);if(!sv('kk_i',IM))toast(t('noSave'));updIV();render()};im.onerror=()=>toast('Не удалось прочитать изображение');im.src=r.result};r.readAsDataURL(f)}
function vGame(){const q=cur(),e=ent(),tm=tmOf(),dn=e&&e.done,n=G.teams.length,rd=(G.qi/n|0)+1,rt=Math.ceil(G.qs.length/n),last=G.qi>=G.qs.length-1;

const opt=q.o.map((o,i)=>{let k=dn?(i==q.a?'ok':(e.sel==i?'bad':'')):(G.sel==i?'sel':'');if(G.hid.includes(i))k='hd';return `<button class="opt ${k}" ${dn?'disabled':''} onclick="pk(${i})">${'АБВГ'[i]}. ${esc(o)}</button>`}).join('');
const fb=dn?`<div class="fb ${e.ok?'ok':'bad'}"><b>${e.skip?'—':e.rev?t('right'):e.ok?t('ok'):t('bad')}</b> ${t('right')}: <b>${esc(q.o[q.a])}</b><p>${q.e}</p><p class="src">${t('src')}: ${SRC[q.s]}</p><p>${e.rep?t('noRew'):e.gr?`+${e.pts} ${t('pts')}${e.keys.length?' · '+t('got'):''}`:S.aw=='m'?'':'+0'}</p>${S.aw=='m'&&!e.gr&&!e.rep?`<button class="b g" onclick="gr1()">${t('grant')}</button>`:''}</div>`:'';
let board='';for(let i=0;i<G.cells;i++){const k=tab*100+i;board+=T.pl.includes(k)?`<div class="pc" style="${pst(k)}"></div>`:`<div class="cell" ondragover="event.preventDefault()" ondrop="event.preventDefault();place(+event.dataTransfer.getData('text/plain'),${i})" onclick="sl(${i})"></div>`}
const tray=T.got.filter(k=>!T.pl.includes(k)).map(k=>`<div class="pc ${G.pick==k?'sel':''}" style="${pst(k)};aspect-ratio:${4*r}/${3*c}" draggable="true" ondragstart="event.dataTransfer.setData('text/plain','${k}')" onclick="pp(${k})"></div>`).join('');
return hdr()+`<main><div class="card" style="margin-bottom:12px;padding:10px 16px"><b>${t('round')} ${rd}/${rt}</b> · ${t('qn')} ${G.qi+1}/${G.qs.length} · ${t('total')}: ${gt}/${tot}<div class="bar"><i style="width:${tot?gt*100/tot:0}%"></i></div></div>
<div class="gm"><section class="card"><span class="tmr ${G.tm<=10?'z':''}" id="tmr">${fmt(G.tm)}</span><span class="chip g">${CAT[q.c]}</span><span class="chip">${LV[q.l]} · ${S.pt[q.l]} ${t('pts')}</span><p style="margin:8px 0 0">${t('team')}: <b>${esc(nm(tm))}</b></p><div class="qt">${esc(S.ed[q.id]||q.q)}</div>${opt}${fb}
<div class="ctl"><button class="b g" ${dn||G.sel==null?'disabled':''} onclick="answer()">${t('ans')}</button><button class="b l" ${dn||G.hid.length?'disabled':''} onclick="hint()">${t('hint')}</button><button class="b l" ${dn?'disabled':''} onclick="rev()">${t('show')}</button></div>
<div class="ctl"><button class="b l" ${G.qi?'':'disabled'} onclick="go(-1)">${t('prev')}</button><button class="b" onclick="nx()">${last?t('toFin'):t('next')}</button><button class="b l" ${G.run||dn?'disabled':''} onclick="contT()">${t('cont')}</button><button class="b l" ${G.run?'':'disabled'} onclick="pauseT()">${t('pause')}</button><button class="b l" onclick="endRound()">${t('endR')}</button></div></section>
<aside><div class="teams">${G.teams.map((x,i)=>`<div class="tm ${i==tm?'a':''}"><b>${esc(nm(i))}</b><span class="sc">${x.sc}</span><small>${t('pcs')}: ${x.got.length}/${own(i).length*G.cells}</small><div class="bar"><i style="width:${x.got.length*100/(own(i).length*G.cells)}%"></i></div></div>`).join('')}</div>
<div class="card"><div class="tabs">${own(tm).map(th=>`<button class="b l ${th==tab?'on':''}" onclick="G.tab=${th};G.pick=null;render()">${TH[th]}</button>`).join('')}<button class="b l" style="margin-left:auto" onclick="setAsm('${S.as=='auto'?'self':'auto'}')">${S.as=='auto'?t('autoM'):t('selfM')}</button></div>
<div class="bd"><div class="gh" style="background-image:var(--i${tab})"></div><div class="gr" style="grid-template-columns:repeat(${c},1fr);grid-template-rows:repeat(${r},1fr)">${board}</div></div>
${S.as=='auto'?'':`<div class="tray">${tray||`<small>${t('empty')}</small>`}</div>`}</div></aside></div></main>`}
function vFinal(){return hdr()+`<main class="fin"><h2>ТӘУЕЛСІЗ ҚАЗАҚСТАН</h2><div class="poster">${[0,1,2,3].map(i=>`<div class="q q${i}" style="background-image:var(--i${i})"><span>${TH[i]}</span></div>`).join('')}<div class="badge">ТӘУЕЛСІЗ<br>ҚАЗАҚСТАН</div></div><p class="cr">${t('cr')}</p><p class="rd">${t('finTxt')}</p><h3 style="color:var(--g);font-size:clamp(22px,2.6vw,34px);margin:8px">${t('mainQ')}</h3><button class="b g" onclick="to('rid')">${t('goRid')}</button></main>`}
const QR=['Что объединяет все элементы изображения?','Какие исторические события и процессы привели Казахстан к независимости?','Что означает независимость для современного Казахстана?'];
const EX=['Все элементы связаны идеей пути к государственной независимости: историческая память (Желтоқсан), государственные символы, правовой акт 16 декабря 1991 г. и развитие независимого государства.','Независимость Казахстана стала результатом длительного исторического развития, стремления к суверенитету и формирования самостоятельной государственности. События декабря 1986 года являются важной частью исторической памяти, но путь к независимости включал также политические, правовые и международные процессы.','Независимость позволяет самостоятельно принимать решения, развивать экономику, язык и культуру, строить отношения с другими странами и укреплять гражданскую идентичность. Это ещё и ответственность граждан за будущее страны.'];
function vRid(){return hdr()+`<main class="card rid"><h2>${t('mainQ')}</h2>${QR.map((q,i)=>`<h3>${i+1}. ${q}</h3><textarea oninput="G.ans[${i}]=this.value;sv('kk_g',G)">${esc(G.ans[i]||'')}</textarea>${G.ex?`<div class="fb ok"><p>${EX[i]}</p></div>`:''}`).join('')}
<h3>Оценка учителя (0–5 баллов)</h3>${G.teams.map((x,i)=>`<div class="trow"><b style="min-width:180px">${esc(nm(i))}</b><input type="number" min="0" max="5" id="fp${i}" value="${G.fin[i]??0}"><button class="b l" onclick="fp(${i})">Начислить</button><span id="fk${i}">${G.fin[i]!=null?'✔ '+G.fin[i]:''}</span></div>`).join('')}
<div class="bt"><button class="b l" ${G.ex?'disabled':''} onclick="conf(t('disc'),()=>{G.ex=1;render()})">${t('ex')}</button><button class="b g" onclick="stopT();to('res')">${t('fin')}</button><button class="b l" onclick="to('final')">←</button></div></main>`}
function fp(i){const v=Math.max(0,Math.min(5,+$('#fp'+i).value||0)),o=G.fin[i]||0;G.teams[i].sc=Math.max(0,G.teams[i].sc+v-o);G.fin[i]=v;hs(`${nm(i)} · финал +${v}`);$('#fk'+i).textContent='✔ '+v;sv('kk_g',G)}
const rt=()=>`<table><tr><th>#</th><th>${t('team')}</th><th>${t('pts')}</th><th>${t('pcs')}</th></tr>${G.teams.map((x,i)=>({x,i})).sort((a,b)=>b.x.sc-a.x.sc).map((o,j)=>`<tr><td>${j+1}</td><td>${esc(nm(o.i))}</td><td><b>${o.x.sc}</b></td><td>${o.x.got.length}/${own(o.i).length*G.cells}</td></tr>`).join('')}</table>`;

/* teacher panel */
function teach(){if(!G)return;const q=cur();M(`<h2>${t('teach')}</h2><h3>Команды</h3>${G.teams.map((x,i)=>`<div class="trow"><input value="${esc(nm(i))}" onchange="S.nm[${i}]=this.value.trim()||'${t('team')} ${i+1}';render()"><b>${x.sc}</b><button class="b l" onclick="adj(${i},-1)">−1</button><button class="b l" onclick="adj(${i},1)">+1</button><span>${t('pcs')}: ${x.got.length}</span><button class="b l" onclick="frag(${i},-1)">− ${t('pcs').toLowerCase()}</button><button class="b l" onclick="frag(${i},1)">+ ${t('pcs').toLowerCase()}</button></div>`).join('')}

<h3>Вопрос ${q.id}</h3><div class="trow"><button class="b l" onclick="skipQ()">Пропустить</button><button class="b l" onclick="rep()">Повторить без награды</button><button class="b l" onclick="edQ()">Изменить формулировку</button><button class="b l" onclick="addQ()">Добавить вопрос</button></div>
<h3>Игра</h3><div class="trow"><button class="b l" onclick="conf('Сбросить текущий раунд? Баллы и фрагменты за него будут отозваны.',rr)">Сбросить раунд</button><button class="b l" onclick="conf(t('cfmNew'),()=>{begin()})">${t('again')}</button><button class="b l" onclick="cM();to('set')">${t('set')} (число команд, категории)</button><button class="b l" onclick="hist()">История ответов</button><button class="b l" onclick="M('<h2>'+t('res')+'</h2>'+rt())">${t('res')}</button></div>`)}

function frag(i,d){const T=G.teams[i];if(d>0){const k=award(i,1);if(k.length)fx(k);else toast('Все фрагменты уже выданы')}else if(T.got.length){rm(T,[T.got[T.got.length-1]])}hs(`${nm(i)} · фрагмент ${d>0?'+':'−'}1`);render();teach()}

const FP=n=>'https://commons.wikimedia.org/wiki/Special:FilePath/'+n+'?width=1200';
const lim=(u,c)=>new Promise((ok,no)=>{const m=new Image();if(c)m.crossOrigin='anonymous';m.onload=()=>ok(m);m.onerror=no;m.src=u});
const fit=(x,m,bx,by,bw,bh)=>{const k=Math.min(bw/m.width,bh/m.height),w=m.width*k,h=m.height*k;x.drawImage(m,bx+(bw-w)/2,by+(bh-h)/2,w,h)};
async function getWeb(i){const s=WS[i];try{const c=document.createElement('canvas');c.width=800;c.height=600;const x=c.getContext('2d');
if(s.u.length>1){const g=x.createLinearGradient(0,0,800,600);g.addColorStop(0,'#0b2a4f');g.addColorStop(1,'#00799a');x.fillStyle=g;x.fillRect(0,0,800,600);const [f,e]=await Promise.all(s.u.map(n=>lim(FP(n),1)));x.shadowColor='#0009';x.shadowBlur=24;fit(x,f,40,150,440,220);fit(x,e,520,120,240,300);x.shadowBlur=0;x.fillStyle='#fec50c';x.font='700 40px "Segoe UI",Arial,sans-serif';x.textAlign='center';x.fillText('Мемлекеттік рәміздер',400,520);x.strokeStyle='#fec50c';x.lineWidth=4;x.strokeRect(14,14,772,572)}
else{const m=await lim(FP(s.u[0]),1),k=Math.max(800/m.width,600/m.height),w=m.width*k,h=m.height*k;x.drawImage(m,(800-w)/2,(600-h)/2,w,h)}

document.documentElement.lang=S.lang;updIV();render();loadWeb();
